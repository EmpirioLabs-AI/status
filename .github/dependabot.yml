version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Nothing here builds a pull request, so a new major version of js-yaml
      # needs the site build checked by hand first. update-types stop only
      # version updates; security updates still arrive.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
