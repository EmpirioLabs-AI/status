version: 2
updates:
  # Version updates wait until a release is a week old: a poisoned release is
  # usually found and pulled within hours. Security updates are not delayed.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Nothing here builds a pull request, so a new major version of js-yaml
      # needs the site build checked by hand first. update-types stop only
      # version updates; security updates still arrive.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
