name: Uptime CI
on:
  schedule:
    - cron: "*/5 * * * *"
  repository_dispatch:
    types: [uptime]
  workflow_dispatch:

concurrency:
  group: uptime-ci
  cancel-in-progress: false

# Each job sets the token permissions it needs; anything else reads only.
permissions:
  contents: read

jobs:
  release:
    name: Check status of all endpoints
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The tip of main when the job starts, not the commit the run was
          # dispatched at: the previous run may have pushed its snapshot
          # since, and starting from older state files makes this run's
          # push conflict, and every rerun of it. The run reads only current
          # files. The full history took about 110 of each run's 134
          # seconds; that time now goes to sampling.
          ref: main
          fetch-depth: 1
          # No token stays in .git/config: each push below gets it for its own
          # step only.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      # uptime-monitor pushes its commit with a plain `git push`, so the push
      # token goes into the git config for that step only.
      - name: Let uptime-monitor push
        env:
          PUSH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $auth"
      - uses: upptime/uptime-monitor@1b53cea83cd619c9ddb2aec18366abd00cfa060d # v1.41.3
        with:
          command: "update"
        env:
          GH_PAT: ${{ secrets.GH_PAT || github.token }}
        continue-on-error: true
      - name: Remove the push token
        if: always()
        run: git config --local --unset-all http.https://github.com/.extraheader || true
      # Runs with github.token so the labels and assignees it sets stick.
      # See scripts/reconcile-incidents.mjs.
      - name: Reconcile incident issues
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/reconcile-incidents.mjs
      # Four samples a minute apart, so each five-minute run covers its slot.
      - name: Record site snapshots
        if: always()
        env:
          SAMPLES_PER_RUN: "4"
          SAMPLE_INTERVAL_SECONDS: "60"
        run: node scripts/record-sites.mjs
      - name: Record model snapshots
        if: always()
        run: node scripts/record-models.mjs
      - name: Commit custom snapshots if changed
        if: always()
        env:
          PUSH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          git config user.name "Upptime Bot"
          git config user.email "73812536+upptime-bot@users.noreply.github.com"
          if git diff --quiet -- history/sites-state.json history/models-state.json; then
            echo "No custom snapshot changes to commit."
            exit 0
          fi
          auth=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          authed() { git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" "$@"; }
          git add history/sites-state.json history/models-state.json
          git commit -m "📊 Record custom status snapshots [skip ci]"
          for i in 1 2 3; do
            if authed push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Pushed on attempt $i"
              exit 0
            fi
            echo "Push failed, rebasing and retrying..."
            # A rebase that stops on a conflict leaves HEAD detached at the
            # upstream tip, where the next push prints "Everything up-to-date"
            # and exits 0 with this run's snapshot commit silently dropped.
            # Observed on 2026-09-15: the step reported "Pushed on attempt 2"
            # having published nothing. Fail loudly instead of swallowing it.
            if ! authed pull --rebase origin "${GITHUB_REF_NAME}"; then
              git rebase --abort 2>/dev/null || true
              echo "Could not rebase onto the remote; this sample is unrecorded."
              exit 1
            fi
          done
          echo "Push failed after retries"
          exit 1
