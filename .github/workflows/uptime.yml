name: Uptime CI
on:
  schedule:
    - cron: "*/5 * * * *"
  repository_dispatch:
    types: [uptime]
  workflow_dispatch:

concurrency:
  group: uptime-ci
  cancel-in-progress: false

jobs:
  release:
    name: Check status of all endpoints
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT || github.token }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - uses: upptime/uptime-monitor@v1.41.3
        with:
          command: "update"
        env:
          GH_PAT: ${{ secrets.GH_PAT || github.token }}
        continue-on-error: true
      # Must run with github.token, not GH_PAT. GH_PAT can open an issue but
      # cannot label or assign it, so Upptime loses track of its own incidents
      # and never closes them. See scripts/reconcile-incidents.mjs.
      - name: Reconcile incident issues
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/reconcile-incidents.mjs
      - name: Record site snapshots
        if: always()
        run: node scripts/record-sites.mjs
      - name: Record model snapshots
        if: always()
        run: node scripts/record-models.mjs
      - name: Commit custom snapshots if changed
        if: always()
        run: |
          git config user.name "Upptime Bot"
          git config user.email "73812536+upptime-bot@users.noreply.github.com"
          if git diff --quiet -- history/sites-state.json history/models-state.json; then
            echo "No custom snapshot changes to commit."
            exit 0
          fi
          git add history/sites-state.json history/models-state.json
          git commit -m "📊 Record custom status snapshots [skip ci]"
          for i in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Pushed on attempt $i"
              exit 0
            fi
            echo "Push failed, rebasing and retrying..."
            # A rebase that stops on a conflict leaves HEAD detached at the
            # upstream tip, where the next push prints "Everything up-to-date"
            # and exits 0 with this run's snapshot commit silently dropped.
            # Observed on 2026-09-15: the step reported "Pushed on attempt 2"
            # having published nothing. Fail loudly instead of swallowing it.
            if ! git pull --rebase origin "${GITHUB_REF_NAME}"; then
              git rebase --abort 2>/dev/null || true
              echo "Could not rebase onto the remote; this sample is unrecorded."
              exit 1
            fi
          done
          echo "Push failed after retries"
          exit 1
