name: Response Time CI
on:
  schedule:
    - cron: "0 23 * * *"
  repository_dispatch:
    types: [response_time]
  workflow_dispatch:
# uptime-monitor pushes its commit with the checkout's token and calls the
# GitHub API with this workflow's own token. That token reads issues but
# cannot open one: an incident is opened by scripts/reconcile-incidents.mjs,
# after it is confirmed.
permissions:
  contents: write
  issues: read

jobs:
  release:
    name: Check response time
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: upptime/uptime-monitor@74f0683383384927e064d76a5f21f340d6af36fc # v1.46.5
        with:
          command: "response-time"
        env:
          GH_PAT: ${{ github.token }}
