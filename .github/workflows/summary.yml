name: Summary CI
on:
  schedule:
    - cron: "0 0 * * *"
  repository_dispatch:
    types: [summary]
  workflow_dispatch:
# uptime-monitor pushes its commit with the checkout's token and calls the
# GitHub API with GH_PAT.
permissions:
  contents: write

jobs:
  release:
    name: Generate README
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: upptime/uptime-monitor@1b53cea83cd619c9ddb2aec18366abd00cfa060d # v1.41.3
        with:
          command: "readme"
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
