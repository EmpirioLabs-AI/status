name: Models History CI
on:
  workflow_dispatch:

# Prevent overlapping runs from racing on the state file
concurrency:
  group: models-history
  cancel-in-progress: false

# Each job sets the token permissions it needs; anything else reads only.
permissions:
  contents: read

jobs:
  record:
    name: Record models snapshot
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      # Keep one sample per workflow run so the check count shown on the page
      # directly reflects how many scheduled runs actually executed.
      SAMPLES_PER_RUN: "1"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1
          # The push token reaches only the commit step.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Record sample
        run: node scripts/record-models.mjs

      - name: Commit if changed
        env:
          PUSH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          git config user.name "Upptime Bot"
          git config user.email "73812536+upptime-bot@users.noreply.github.com"
          if git diff --quiet -- history/models-state.json; then
            echo "No changes to commit."
            exit 0
          fi
          auth=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          authed() { git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" "$@"; }
          # Pull --rebase to avoid races with the every-5-min Uptime CI commits
          authed pull --rebase origin "${GITHUB_REF_NAME}" || true
          git add history/models-state.json
          git commit -m "📊 Record models snapshot [skip ci]"
          # Retry push a few times in case of concurrent commits
          for i in 1 2 3; do
            if authed push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Pushed on attempt $i"
              exit 0
            fi
            echo "Push failed, rebasing and retrying..."
            authed pull --rebase origin "${GITHUB_REF_NAME}" || true
          done
          echo "Push failed after retries"
          exit 1
