name: Static Site CI
on:
  schedule:
    - cron: "0 1 * * *"
  push:
    branches:
      - main
      - master
  workflow_run:
    workflows:
      - "Uptime CI"
      - "Response Time CI"
      - "Summary CI"
      - "Models History CI"
      - "Sites History CI"
    types: [completed]
  repository_dispatch:
    types: [static_site]
  workflow_dispatch:
concurrency:
  group: static-site-deploy
  cancel-in-progress: false
# Each job sets the token permissions it needs; anything else reads only.
permissions:
  contents: read

jobs:
  release:
    name: Build and deploy site
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          # Nothing here pushes with git: the deploy action uses github.token.
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build site
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run build
      - name: GitHub Pages Deploy
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ github.token }}
          publish_dir: "_site"
          force_orphan: "true"
          user_name: "Upptime Bot"
          user_email: "73812536+upptime-bot@users.noreply.github.com"
