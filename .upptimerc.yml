# See https://upptime.js.org/docs/configuration for full docs

owner: EmpirioLabs-AI
repo: status

# A row with readyUrl is also down while that service's requests are failing.
sites:
  - name: Website
    url: https://empiriolabs.ai
    expectedStatusCodes: [200, 301, 302, 308]
    icon: https://empiriolabs.ai/images/favicon.png

  - name: Documentation
    url: https://docs.empiriolabs.ai
    expectedStatusCodes: [200, 301, 302, 308]
    icon: https://empiriolabs.ai/images/favicon.png

  # Down while API requests are failing; asked about the time since its
  # previous check, so a failure between two checks is still recorded.
  - name: API Gateway
    url: https://api.empiriolabs.ai/readyz
    slug: api
    sinceParam: since
    expectedStatusCodes: [200]
    __dangerous__body_down_if_text_missing: '"status":"ok"'
    icon: https://empiriolabs.ai/images/favicon.png

  - name: Models
    url: https://api.empiriolabs.ai/health
    slug: models
    expectedStatusCodes: [200]
    __dangerous__body_down_if_text_missing: '"service":"gateway"'
    icon: https://empiriolabs.ai/images/favicon.png

  - name: GPU Cloud
    url: https://api.empiriolabs.ai/v1/gpu/catalog
    readyUrl: https://api.empiriolabs.ai/readyz?surface=gpu-cloud
    slug: gpu-cloud
    expectedStatusCodes: [200]
    __dangerous__body_down_if_text_missing: '"object":"list"'
    icon: https://empiriolabs.ai/images/favicon.png

  - name: Hosted Agents
    url: https://api.empiriolabs.ai/v1/hosted-agents/health
    readyUrl: https://api.empiriolabs.ai/readyz?surface=agents
    slug: agents
    expectedStatusCodes: [200]
    __dangerous__body_down_if_text_missing: '"service":"hosted-agents"'
    icon: https://empiriolabs.ai/images/favicon.png

  - name: Dashboard
    url: https://platform.empiriolabs.ai/auth/login
    readyUrl: https://platform.empiriolabs.ai/api/health/ready
    slug: dashboard
    expectedStatusCodes: [200]
    icon: https://empiriolabs.ai/images/favicon.png

  # A correct HTTP 400 is invisible to the Dashboard row, which counts FAILED calls: every
  # email sign-in was refused for 8 hours on 2026-10-22 while this page stayed green. This
  # row asks the auth service one question and reads the reason in its answer.
  - name: Account sign-in
    url: https://platform.empiriolabs.ai/api/health/signin
    slug: account-sign-in
    expectedStatusCodes: [200]
    __dangerous__body_down_if_text_missing: '"status":"ok"'
    icon: https://empiriolabs.ai/images/favicon.png

  - name: MCP Server
    url: https://mcp.empiriolabs.ai/livez
    readyUrl: https://api.empiriolabs.ai/readyz
    slug: mcp
    expectedStatusCodes: [200]
    __dangerous__body_down_if_text_missing: '"status":"ok"'
    icon: https://empiriolabs.ai/images/favicon.png

  - name: Media Delivery
    url: https://media.empiriolabs.ai/assets/empirio-og-logo.png
    slug: media-delivery
    expectedStatusCodes: [200]
    icon: https://empiriolabs.ai/images/favicon.png

status-website:
  cname: status.empiriolabs.ai
  baseUrl: /
  name: EmpirioLabs AI
  introTitle: "EmpirioLabs AI Status"
  introMessage: >
    Real-time operational status of EmpirioLabs AI services. If you're
    experiencing an issue not reflected here, please reach out to
    [support@empiriolabs.ai](mailto:support@empiriolabs.ai).
  logoUrl: https://empiriolabs.ai/images/site-logo.webp
  favicon: https://empiriolabs.ai/images/favicon.png
  themeUrl: https://raw.githubusercontent.com/EmpirioLabs-AI/status/main/assets/empirio.css
  metaTags:
    - name: "color-scheme"
      content: "dark"
    - name: "theme-color"
      content: "#000815"
    - name: "description"
      content: "Live operational status of EmpirioLabs AI services."
  links:
    - rel: preconnect
      href: https://fonts.googleapis.com
    - rel: stylesheet
      href: https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap
    - rel: apple-touch-icon
      href: https://empiriolabs.ai/images/favicon-192.png

i18n:
  footer: "© EmpirioLabs AI"

assignees:
  - Adam-Dalloul

# How often to run uptime checks (cron)
workflowSchedule:
  graphs: "0 0 * * *"
  responseTime: "0 23 * * *"
  staticSite: "0 1 * * *"
  summary: "0 0 * * *"
  updates: "0 3 * * *"
  updateTemplate: "0 0 * * 0"
  uptime: "*/5 * * * *"

# Open an incident issue when a site goes down
notifications:
  - type: github
    label: status
