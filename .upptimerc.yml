# See https://upptime.js.org/docs/configuration for full docs

owner: EmpirioLabs-AI
repo: status

sites:
  - name: Website
    url: https://empiriolabs.ai
    expectedStatusCodes: [200, 301, 302, 308]
    icon: https://empiriolabs.ai/images/favicon.png

  - name: Documentation
    url: https://docs.empiriolabs.ai
    expectedStatusCodes: [200, 301, 302, 308]
    icon: https://empiriolabs.ai/images/favicon.png

  - name: API Gateway
    url: https://api.empiriolabs.ai/livez
    slug: api
    expectedStatusCodes: [200]
    __dangerous__body_down_if_text_missing: '"status":"ok"'
    icon: https://empiriolabs.ai/images/favicon.png

  - name: Models
    url: https://api.empiriolabs.ai/health
    slug: models
    expectedStatusCodes: [200]
    __dangerous__body_down_if_text_missing: '"service":"gateway"'
    icon: https://empiriolabs.ai/images/favicon.png

  - name: GPU Cloud
    url: https://api.empiriolabs.ai/v1/gpu/catalog
    slug: gpu-cloud
    expectedStatusCodes: [200]
    __dangerous__body_down_if_text_missing: '"object":"list"'
    icon: https://empiriolabs.ai/images/favicon.png

  - name: Hosted Agents
    url: https://api.empiriolabs.ai/v1/hosted-agents/health
    slug: agents
    expectedStatusCodes: [200]
    __dangerous__body_down_if_text_missing: '"service":"hosted-agents"'
    icon: https://empiriolabs.ai/images/favicon.png

  - name: Dashboard
    url: https://platform.empiriolabs.ai/auth/login
    slug: dashboard
    expectedStatusCodes: [200]
    icon: https://empiriolabs.ai/images/favicon.png

  - name: MCP Server
    url: https://mcp.empiriolabs.ai/livez
    slug: mcp
    expectedStatusCodes: [200]
    __dangerous__body_down_if_text_missing: '"status":"ok"'
    icon: https://empiriolabs.ai/images/favicon.png

  - name: Model Catalog
    url: https://catalog.empiriolabs.ai/health
    slug: catalog
    expectedStatusCodes: [200]
    __dangerous__body_down_if_text_missing: '"status":"ok"'
    icon: https://empiriolabs.ai/images/favicon.png

  - name: Media Delivery
    url: https://media.empiriolabs.ai/assets/empirio-og-logo.png
    slug: media
    expectedStatusCodes: [200]
    icon: https://empiriolabs.ai/images/favicon.png

status-website:
  cname: status.empiriolabs.ai
  baseUrl: /
  name: EmpirioLabs AI
  introTitle: "EmpirioLabs AI Status"
  introMessage: >
    Real-time operational status of EmpirioLabs AI services. If you're
    experiencing an issue not reflected here, please reach out to
    [support@empiriolabs.ai](mailto:support@empiriolabs.ai).
  logoUrl: https://empiriolabs.ai/images/site-logo.webp
  favicon: https://empiriolabs.ai/images/favicon.png
  themeUrl: https://raw.githubusercontent.com/EmpirioLabs-AI/status/main/assets/empirio.css
  metaTags:
    - name: "color-scheme"
      content: "dark"
    - name: "theme-color"
      content: "#000815"
    - name: "description"
      content: "Live operational status of EmpirioLabs AI services."
  links:
    - rel: preconnect
      href: https://fonts.googleapis.com
    - rel: stylesheet
      href: https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap
    - rel: apple-touch-icon
      href: https://empiriolabs.ai/images/favicon-192.png

i18n:
  footer: "© EmpirioLabs AI"

assignees:
  - Adam-Dalloul

# How often to run uptime checks (cron)
workflowSchedule:
  graphs: "0 0 * * *"
  responseTime: "0 23 * * *"
  staticSite: "0 1 * * *"
  summary: "0 0 * * *"
  updates: "0 3 * * *"
  updateTemplate: "0 0 * * 0"
  uptime: "*/5 * * * *"

# Open an incident issue when a site goes down
notifications:
  - type: github
    label: status
